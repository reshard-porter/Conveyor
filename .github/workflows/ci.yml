name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false # no third-party dependencies, so nothing to cache
      - name: Lint
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: Test
        env:
          # The default postgres image uses SCRAM-SHA-256, so this also exercises the driver's auth.
          CONVEYOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 -p 1 ./...
