# One API process and two worker replicas sharing a Postgres database.
#   docker compose up --build
#   curl localhost:8080/v1/queues
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: conveyor
      POSTGRES_DB: conveyor
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    command: ["serve", "-role", "api"]
    environment: &env
      DATABASE_URL: postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
      LOG_LEVEL: info
      # CONVEYOR_API_KEY: change-me
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    command: ["serve", "-role", "worker", "-concurrency", "20", "-addr", ":9090"]
    environment: *env
    deploy:
      replicas: 2
    stop_grace_period: 40s # > shutdown-timeout so in-flight jobs can finish
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
